                    gold: 1250, xp: 0, level: 1, streak: 1, lastActiveDate: new Date().toISOString().split('T')[0],
                    equippedRod: 'basic-driftwood-rod', purchasedRods: ['basic-driftwood-rod'],
                    selectedZone: 'calm-lake', weather: 'Sunny'
                  };
                  await setDoc(profileRef, defaultProf);
                  setProfile({ ...defaultProf, isFirebase: true });
                  for (const habit of DEFAULT_HABITS) {
                    await setDoc(doc(db, 'profiles', currentUser.uid, 'habits', habit.id), habit);
                  }
                  for (const fish of ALL_FISH_SPECIES) {
                    await setDoc(doc(db, 'profiles', currentUser.uid, 'codex', fish.id), fish);
                  }
                }

                const unsubProfile = onSnapshot(profileRef, (snap) => {
                  if (snap.exists()) setProfile(prev => ({ ...snap.data(), uid: currentUser.uid, isFirebase: true }));
                });
                const unsubHabits = onSnapshot(collection(db, 'profiles', currentUser.uid, 'habits'), (snap) => {
                  const list = [];
                  snap.forEach(d => list.push(d.data()));
                  if (list.length > 0) setHabits(list.sort((a,b) => a.id.localeCompare(b.id)));
                });
                const unsubCodex = onSnapshot(collection(db, 'profiles', currentUser.uid, 'codex'), (snap) => {
                  const list = [];
                  snap.forEach(d => list.push(d.data()));
                  if (list.length > 0) setCodex(list.sort((a,b) => a.id.localeCompare(b.id)));
                });
                const unsubLogs = onSnapshot(collection(db, 'profiles', currentUser.uid, 'logs'), (snap) => {
                  const list = [];
                  snap.forEach(d => list.push({ ...d.data(), id: d.id }));
                  setLogs(list.sort((a,b) => b.timestamp.localeCompare(a.timestamp)));
                });

                return () => { unsubProfile(); unsubHabits(); unsubCodex(); unsubLogs(); };
              } catch (e) {
                console.error("Firestore Loading Failed:", e);
              }
            } else {
              setUser(null);
              const localProfile = localStorage.getItem('angler_profile');
              const localHabits = localStorage.getItem('angler_habits');
              const localCodex = localStorage.getItem('angler_codex');
              const localShop = localStorage.getItem('angler_shop');
              const localLogs = localStorage.getItem('angler_logs');
              if (localProfile) setProfile(JSON.parse(localProfile));
              if (localHabits) setHabits(JSON.parse(localHabits));
              if (localCodex) setCodex(JSON.parse(localCodex));
              if (localShop) setShop(JSON.parse(localShop));
              if (localLogs) setLogs(JSON.parse(localLogs));
            }
            setLoading(false);
          });
          return () => unsubscribe();
        }, []);

        useEffect(() => {
          if (!user) {
            localStorage.setItem('angler_profile', JSON.stringify(profile));
            localStorage.setItem('angler_habits', JSON.stringify(habits));
            localStorage.setItem('angler_codex', JSON.stringify(codex));
            localStorage.setItem('angler_shop', JSON.stringify(shop));
            localStorage.setItem('angler_logs', JSON.stringify(logs));
          }
        }, [profile, habits, codex, shop, logs, user]);

        useEffect(() => {
          const currentZone = MAP_ZONES.find(z => z.id === profile.selectedZone);
          if (currentZone) {
            const zoneFish = codex.filter(f => f.zone === currentZone.name);
            if (zoneFish.length > 0) {
              const currentNext = codex.find(f => f.id === nextFishId);
              if (!currentNext || currentNext.zone !== currentZone.name) {
                setNextFishId(zoneFish[Math.floor(Math.random() * zoneFish.length)].id);
              }
            }
          }
        }, [profile.selectedZone, codex, nextFishId]);

        useEffect(() => {
          const currentLevel = profile.level;
          const currentZone = profile.selectedZone;
          const updatedZones = MAP_ZONES.map(z => {
            const isCurrentlyHere = z.id === currentZone;
            let status = 'LOCKED';
            if (currentLevel >= z.minLevel) status = 'UNLOCKED';
            if (isCurrentlyHere) status = 'CURRENTLY HERE';
            const zoneFish = codex.filter(f => f.zone === z.name);
            const caughtCount = zoneFish.filter(f => f.caught).length;
            const totalCount = zoneFish.length;
            if (totalCount > 0 && caughtCount === totalCount) status = isCurrentlyHere ? 'CURRENTLY HERE' : 'COMPLETE';
            if (z.id === 'the-abyss' && currentLevel < z.minLevel) status = 'MYSTERIOUS';
            else if (currentLevel < z.minLevel) status = 'LOCKED';
            return { ...z, status, totalSpecies: totalCount, caughtSpecies: caughtCount };
          });
          setZones(updatedZones);
        }, [profile.level, profile.selectedZone, codex]);

        const toggleHabit = async (habitId) => {
          const habit = habits.find(h => h.id === habitId);
          if (!habit) return;
          const newCompleted = !habit.completed;
          const goldBonus = newCompleted ? habit.rewardGold : -habit.rewardGold;
          const xpBonus = newCompleted ? habit.rewardXp : -habit.rewardXp;

          const updatedHabits = habits.map(h => h.id === habitId ? { ...h, completed: newCompleted, lastUpdated: new Date().toISOString() } : h);
          setHabits(updatedHabits);

          const nextXp = Math.max(0, profile.xp + xpBonus);
          const nextLevel = getLevelFromXp(nextXp);
          const goldMultiplier = profile.purchasedRods.includes('golden-reel') ? 1.2 : 1.0;
          const actualGold = Math.round(goldBonus * (goldBonus > 0 ? goldMultiplier : 1.0));
          const nextGold = Math.max(0, profile.gold + actualGold);

          if (nextLevel > profile.level) showToast(`🏆 LEVEL UP! You reached Level ${nextLevel}!`, 'loot', 'arrow_upward');
          showToast(newCompleted ? `Completed "${habit.title}"! Got +${habit.rewardXp} XP, +${actualGold}g!` : `Unchecked "${habit.title}".`, newCompleted ? 'success' : 'info');

          setProfile(prev => ({ ...prev, xp: nextXp, level: nextLevel, gold: nextGold }));

          if (newCompleted) {
            setLogs(prev => [{ id: Date.now().toString(), type: 'habit', message: `Completed daily routine: ${habit.title}.`, timestamp: new Date().toISOString() }, ...prev]);
          }

          if (user) {
            try {
              await updateDoc(doc(db, 'profiles', user.uid), { xp: nextXp, level: nextLevel, gold: nextGold });
              await updateDoc(doc(db, 'profiles', user.uid, 'habits', habitId), { completed: newCompleted, lastUpdated: new Date().toISOString() });
              if (newCompleted) {
                await setDoc(doc(collection(db, 'profiles', user.uid, 'logs')), { type: 'habit', message: `Completed daily routine: ${habit.title}.`, timestamp: new Date().toISOString() });
              }
            } catch (err) { console.error(err); }
          }
        };

        const buyItem = async (itemId) => {
          const item = shop.find(i => i.id === itemId);
          if (!item) return;
          if (item.price > profile.gold) {
            showToast(`Not enough gold! You need ${item.price}g.`, 'error', 'lock');
            return;
          }
          const nextGold = profile.gold - item.price;
          const isRod = item.category === 'RODS';
          setProfile(prev => ({ ...prev, gold: nextGold, purchasedRods: [...prev.purchasedRods, itemId], equippedRod: isRod ? itemId : prev.equippedRod }));
          setShop(prev => prev.map(i => i.id === itemId ? { ...i, unlocked: true } : i));
          showToast(`Successfully purchased ${item.name}!`, 'loot', 'payments');
          setLogs(prev => [{ id: Date.now().toString(), type: 'purchase', message: `Purchased ${item.name} from item shop.`, timestamp: new Date().toISOString() }, ...prev]);

          if (user) {
            try {
              await updateDoc(doc(db, 'profiles', user.uid), { gold: nextGold, purchasedRods: [...profile.purchasedRods, itemId], equippedRod: isRod ? itemId : profile.equippedRod });
              await setDoc(doc(collection(db, 'profiles', user.uid, 'logs')), { type: 'purchase', message: `Purchased ${item.name} from item shop.`, timestamp: new Date().toISOString() });
            } catch (err) { console.error(err); }
          }
        };

        const travelToZone = async (zoneId) => {
          const zone = MAP_ZONES.find(z => z.id === zoneId);
          if (!zone || profile.level < zone.minLevel) return;
          setProfile(prev => ({ ...prev, selectedZone: zoneId }));
          showToast(`Set sail to ${zone.name}!`, 'info', 'explore');
          setLogs(prev => [{ id: Date.now().toString(), type: 'travel', message: `Traveled to ${zone.name} waters.`, timestamp: new Date().toISOString() }, ...prev]);

          if (user) {
            try {
              await updateDoc(doc(db, 'profiles', user.uid), { selectedZone: zoneId });
              await setDoc(doc(collection(db, 'profiles', user.uid, 'logs')), { type: 'travel', message: `Traveled to ${zone.name} waters.`, timestamp: new Date().toISOString() });
            } catch (err) { console.error(err); }
          }
        };

        const castFishLine = async () => {
          const currentZone = MAP_ZONES.find(z => z.id === profile.selectedZone);
          if (!currentZone) return;
          showToast("Casting line... Waiting for a bite...", 'info', 'phishing');

          setTimeout(async () => {
            const zoneFish = codex.filter(f => f.zone === currentZone.name);
            let chosen = codex.find(f => f.id === nextFishId && f.zone === currentZone.name) || zoneFish[Math.floor(Math.random() * zoneFish.length)];
            if (!chosen) return;

            setCodex(prev => prev.map(f => f.id === chosen.id ? { ...f, caught: true, count: f.count + 1 } : f));
            const baseGold = chosen.rarity === 'Common' ? 50 : chosen.rarity === 'Rare' ? 120 : chosen.rarity === 'Epic' ? 250 : 500;
            const mult = profile.purchasedRods.includes('golden-reel') ? 1.2 : 1.0;
            const payouts = Math.round(baseGold * mult);

            const nextGold = profile.gold + payouts;
            const nextXp = profile.xp + 20;
            const nextLevel = getLevelFromXp(nextXp);

            setProfile(prev => ({ ...prev, gold: nextGold, xp: nextXp, level: nextLevel }));
            showToast(`🎉 CAUGHT A FISH! Obtained ${chosen.name} (+${payouts}g, +20 XP!)`, 'loot', 'catching');
            if (nextLevel > profile.level) showToast(`🏆 LEVEL UP! Reached Level ${nextLevel}!`, 'loot', 'arrow_upward');

            setLogs(prev => [{ id: Date.now().toString(), type: 'catch', message: `Caught ${chosen.name} in ${currentZone.name}.`, timestamp: new Date().toISOString() }, ...prev]);

            if (user) {
              try {
                await updateDoc(doc(db, 'profiles', user.uid), { gold: nextGold, xp: nextXp, level: nextLevel });
                await updateDoc(doc(db, 'profiles', user.uid, 'codex', chosen.id), { caught: true, count: increment(1) });
                await setDoc(doc(collection(db, 'profiles', user.uid, 'logs')), { type: 'catch', message: `Caught ${chosen.name} in ${currentZone.name}.`, timestamp: new Date().toISOString() });
              } catch (err) { console.error(err); }
            }
          }, 1500);
        };

        const instantLevelUp = async () => {
          const nextLevel = profile.level + 1;
          const nextXp = (nextLevel - 1) * 100;
          const nextGold = profile.gold + 500;
          setProfile(prev => ({ ...prev, xp: nextXp, level: nextLevel, gold: nextGold }));
          showToast(`🏆 INSTANT LEVEL UP! Reached Level ${nextLevel}! +500g!`, 'loot', 'arrow_upward');
          setLogs(prev => [{ id: Date.now().toString(), type: 'travel', message: `QA Instant Level Up triggered. Level: ${nextLevel}`, timestamp: new Date().toISOString() }, ...prev]);

          if (user) {
            try {
              await updateDoc(doc(db, 'profiles', user.uid), { xp: nextXp, level: nextLevel, gold: nextGold });
              await setDoc(doc(collection(db, 'profiles', user.uid, 'logs')), { type: 'travel', message: `QA Instant Level Up triggered. Level: ${nextLevel}`, timestamp: new Date().toISOString() });
            } catch (err) { console.error(err); }
          }
        };

        return (
          <GameContext.Provider value={{
            profile, habits, codex, shop, zones, logs, user, loading, toasts, nextFishId,
            showToast, removeToast, login, logout, toggleHabit, buyItem, travelToZone, castFishLine, instantLevelUp
          }}>
            {children}
          </GameContext.Provider>
        );
      }

      function useGame() {
        const c = useContext(GameContext);
        if (!c) throw new Error("Context missing");
        return c;
      }

      function HabitCard({ habit, toggleHabit, showToast }) {
        const [isExpanded, setIsExpanded] = useState(false);
        const [pomoSecs, setPomoSecs] = useState(1800);
        const [isPomoActive, setIsPomoActive] = useState(false);
        const [isSpeedy, setIsSpeedy] = useState(false);
        const [violinDone, setViolinDone] = useState(() => localStorage.getItem(`sub_violin_${habit.id}`) === 'true');
        const [hydrationMl, setHydrationMl] = useState(() => parseInt(localStorage.getItem('hydration_ml') || '0', 10));
        const [pourState, setPourState] = useState(false);

        useEffect(() => {
          if (habit.id === 'study-session') setPomoSecs(isSpeedy ? 10 : 1800);
        }, [isSpeedy, habit.id]);

        useEffect(() => {
          let t;
          if (isPomoActive) {
            t = setInterval(() => {
              setPomoSecs(p => {
                if (p <= 1) {
                  setIsPomoActive(false);
                  if (!habit.completed) toggleHabit(habit.id);
                  showToast('🍅 Focus complete! Study session logged.', 'success', 'timer');
                  return isSpeedy ? 10 : 1800;
                }
                return p - 1;
              });
            }, 1000);
          }
          return () => clearInterval(t);
        }, [isPomoActive, isSpeedy, habit]);

        const changeHydration = (val) => {
          const cap = Math.min(2000, Math.max(0, val));
          setHydrationMl(cap);
          localStorage.setItem('hydration_ml', cap);
          if (cap >= 2000) {
            if (!habit.completed) {
              toggleHabit(habit.id);
              showToast('💧 Hydration Target Met! 2.0 Liters reacher!', 'success', 'water_drop');
            }
          } else if (habit.completed) {
            toggleHabit(habit.id);
          }
        };

        const renderWidget = () => {
          if (habit.id === 'study-session') {
            const pct = 100 - (pomoSecs / (isSpeedy ? 10 : 1800)) * 100;
            return (
              <div className="mt-3 p-4 bg-[#0a0f1d]/90 rounded-xl border border-slate-800 space-y-3">
                <div className="flex justify-between items-center border-b border-slate-800 pb-2">
                  <span className="text-xs font-bold text-[#44e2cd] uppercase">⏱️ Focus Timer</span>
                  <button onClick={() => setIsSpeedy(!isSpeedy)} className={`text-[10px] px-2 py-0.5 rounded border ${isSpeedy ? 'bg-amber-500/10 text-amber-400 border-amber-500/30' : 'bg-slate-800 text-slate-400 border-slate-700'}`}>
                    🚀 Speedy (10s)
                  </button>
                </div>
                <div className="flex flex-col items-center py-2">
                  <div className="relative w-28 h-28 flex items-center justify-center rounded-full bg-slate-950 border border-slate-800">
                    <svg className="absolute inset-0 w-full h-full transform -rotate-90" viewBox="0 0 100 100">
                      <circle cx="50" cy="50" r="45" fill="transparent" stroke="#1e293b" strokeWidth="6" />
                      <circle cx="50" cy="50" r="45" fill="transparent" stroke="#44e2cd" strokeWidth="6" strokeDasharray="283" strokeDashoffset={283 - (283 * pct) / 100} />
                    </svg>
                    <div className="text-center z-10">
                      <p className="font-mono text-lg font-extrabold text-white">{Math.floor(pomoSecs / 60)}:{(pomoSecs % 60).toString().padStart(2, '0')}</p>
                    </div>
                  </div>
                  <div className="flex gap-2 mt-3">
                    <button onClick={() => setIsPomoActive(!isPomoActive)} className="px-3 py-1 bg-cyan-950 text-cyan-400 border border-cyan-500/30 rounded text-xs">
                      {isPomoActive ? 'Pause' : 'Start'}
                    </button>
                    <button onClick={() => { setPomoSecs(isSpeedy ? 10 : 1800); setIsPomoActive(false); }} className="px-3 py-1 bg-slate-800 text-white rounded text-xs">
                      Reset
                    </button>
                  </div>
                </div>
              </div>
            );
          }
          if (habit.id === 'skill-practice') {
            return (
              <div className="mt-3 p-4 bg-[#0a0f1d]/90 rounded-xl border border-slate-800 space-y-2">
                <p className="text-xs font-bold text-emerald-400 uppercase">📝 Technique Practice Checklist</p>
                <div onClick={() => {
                  const state = !violinDone; setViolinDone(state);
                  localStorage.setItem(`sub_violin_${habit.id}`, String(state));
                  if (state && !habit.completed) toggleHabit(habit.id);
                  showToast(state ? '🎻 Violin practice checked!' : 'Violin practice unchecked.', 'info');
                }} className="p-3 bg-slate-900 border border-slate-850 rounded-xl flex justify-between cursor-pointer active-tap select-none">
                  <div className="flex gap-2"><span>🎻</span><p className="text-xs font-bold text-white">Violin Dexterity Drills</p></div>
                  <div className={`w-5 h-5 rounded border ${violinDone ? 'bg-emerald-500/20 border-emerald-500 text-emerald-400' : 'border-slate-700'}`}>
                    {violinDone && <Check className="w-3.5 h-3.5" />}
                  </div>
                </div>
              </div>
            );
          }
          if (habit.id === 'hydration-2l') {
            const pct = (hydrationMl / 2000) * 100;
            return (
              <div className="mt-3 p-4 bg-[#0a0f1d]/90 rounded-xl border border-slate-800 space-y-3">
                <p className="text-xs font-bold text-cyan-400 uppercase">🧪 Personal Hydration (2.0L Target)</p>
                <div className="flex justify-center items-center gap-6 py-1">
                  <div className="flex flex-col items-center">
                    <div draggable onDragStart={(e) => e.dataTransfer.setData('text', '250')} className="w-14 h-14 bg-cyan-950/20 border border-dashed border-cyan-500/50 rounded-xl flex flex-col justify-center items-center cursor-pointer active-tap">
                      <span className="material-symbols-outlined text-cyan-400">local_cafe</span>
                      <span className="text-[9px] font-bold text-cyan-400 mt-1">+250ml</span>
                    </div>
                    <button onClick={() => changeHydration(hydrationMl+250)} className="mt-2 text-[10px] text-cyan-450 border border-cyan-800 bg-cyan-950/20 px-2 py-0.5 rounded">Quick Sip</button>
                  </div>
                  <div onDragOver={(e)=>e.preventDefault()} onDrop={(e)=>{ changeHydration(hydrationMl+250); }} className="w-20 h-36 rounded-b-2xl rounded-t-lg border-2 border-slate-700 relative overflow-hidden bg-slate-950 flex items-end">
                    <div className="absolute inset-0 flex flex-col justify-between text-[7px] text-slate-600 font-mono px-1 py-2">
                      <span>2.0L</span><span>1.5L</span><span>1.0L</span><span>0.5L</span>
                    </div>
                    <div className="w-full bg-cyan-500/60 transition-all duration-500" style={{ height: `${pct}%` }}>
                      {pct >= 100 && <span className="text-[10px] text-white flex justify-center py-2">Full!</span>}
                    </div>
                  </div>
                  <div className="flex flex-col gap-1 items-start">
                    <p className="text-xs font-bold text-white mb-2">{hydrationMl} ml</p>
                    <input type="range" min="0" max="2000" step="250" value={hydrationMl} onChange={(e)=>changeHydration(parseInt(e.target.value))} className="accent-cyan-400" />
                    <button onClick={()=>changeHydration(0)} className="text-[10px] text-rose-400 border border-rose-900 bg-rose-950/10 px-2 py-0.5 rounded mt-2">Reset</button>
                  </div>
                </div>
              </div>
            );
          }
          return null;
        };

        const hasDetails = ['study-session', 'skill-practice', 'hydration-2l'].includes(habit.id);

        return (
          <div className="flex flex-col w-full">
            <div onClick={() => hasDetails ? setIsExpanded(!isExpanded) : toggleHabit(habit.id)} className={`flex items-center justify-between p-3.5 rounded-xl transition-all border cursor-pointer active-tap ${habit.completed ? 'bg-[#44e2cd]/10 border-[#44e2cd]/40' : 'bg-[#141b2b]/40 border-[#2e3545]/40 hover:border-slate-700'}`}>
              <div className="flex flex-col text-left">
                <span className={`text-sm font-semibold flex items-center gap-1.5 ${habit.completed ? 'text-white' : 'text-[#c5c6cd]'}`}>
                  {habit.title} {hasDetails && <span className="bg-slate-800 text-[#44e2cd] text-[9px] px-1 rounded uppercase font-bold leading-none">interactive</span>}
                </span>
                <span className="text-[9px] uppercase font-bold text-amber-500 tracking-wider mt-0.5">{habit.bonusText}</span>
              </div>
              <div className="flex items-center gap-2">
                {hasDetails && (
                  <button onClick={()=>{}} className="w-6 h-6 flex justify-center items-center text-slate-500">
                    {isExpanded ? <ChevronUp className="w-4 h-4"/> : <ChevronDown className="w-4 h-4"/>}
                  </button>
                )}
                <div onClick={(e) => { e.stopPropagation(); toggleHabit(habit.id); }} className={`w-7 h-7 rounded border-2 flex items-center justify-center transition-all ${habit.completed ? 'bg-[#44e2cd]/20 border-[#44e2cd] text-[#44e2cd]' : 'border-slate-700 text-transparent'}`}>
                  <span className="material-symbols-outlined text-sm font-bold">check</span>
                </div>
              </div>
            </div>
            {isExpanded && hasDetails && renderWidget()}
          </div>
        );
      }

      // Render the App
      const container = document.getElementById("root");
